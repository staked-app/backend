services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: ${ST_DB_PASSWORD:?ST_DB_PASSWORD is not set}
      POSTGRES_DB: supertokens
    volumes:
      - st_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertokens -d supertokens"]
      interval: 5s
      timeout: 5s
      retries: 10

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://supertokens:${ST_DB_PASSWORD}@db:5432/supertokens"
      API_KEYS: ${ST_API_KEY:?ST_API_KEY is not set}
    ports:
      - "127.0.0.1:3567:3567"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  st_db: